spring:
  datasource:
    url: jdbc:h2:mem:koim;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

koim:
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret-32bytes!
    expire-minutes: 60
  ws:
    path: /ws/chat
  online-manager: memory
